# Keeps the workflow actions current. Each PR it opens updates the tag in the workflow and
# the matching commit in actions.lock together. There is nothing else to update: the site
# has no package manager by design.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/New_York
    # A new release waits a week before Dependabot proposes it, so a hijacked tag that gets
    # yanked in its first days never reaches a PR here.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
