# Cloudflare Workers: a preview for every pull request, production on every merge to main.
#
# The flow O.J. set on 12 November 2026. A PR is a complete thing. It carries its preview
# URL, she and Codex comment on the preview, the author iterates on the branch, she merges,
# and main deploys to production. Nothing reaches production without a merge, and a merge
# needs the Checks workflow green under the ruleset on main.
#
# Previews are Workers Previews, one per PR, named pr-<number>, isolated from production.
# The URL is stable across pushes, so the link in the PR description stays right. The
# preview is deleted when the PR closes.
#
# The two secrets, CLOUDFLARE_API_TOKEN (Workers Scripts Edit) and CLOUDFLARE_ACCOUNT_ID,
# are repository secrets O.J. sets. Repository secrets are not available to a PR from a
# fork, and the preview job also refuses to run on one, so a fork cannot spend them.
#
# The GitHub Pages workflow (ci.yaml) keeps serving learnwithoj.com until she cuts DNS over
# to the Worker. Until then this workflow deploys to the workers.dev hostname only.

name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_VERSION: "4.160.1"

jobs:
  preview:
    name: Preview for the pull request
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Until O.J. adds the two secrets this job has nothing to deploy with. It says so and
      # stops green rather than failing every PR in the meantime.
      - name: The Cloudflare secrets exist
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, skipping"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the preview
        id: preview
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: preview --name "pr-${{ github.event.pull_request.number }}" --var "COMMIT_SHA:${{ github.event.pull_request.head.sha }}" --var "BRANCH:${{ github.head_ref }}"

      # One comment per PR, edited on every push, so the thread stays short for her.
      - name: Post the preview URL on the PR
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.preview-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --edit-last --create-if-none --body "Preview: $URL (commit ${SHA:0:7})"

  cleanup:
    name: Delete the preview when the PR closes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Until O.J. adds the two secrets this job has nothing to deploy with. It says so and
      # stops green rather than failing every PR in the meantime.
      - name: The Cloudflare secrets exist
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, skipping"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation

  production:
    name: Deploy main to production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Until O.J. adds the two secrets this job has nothing to deploy with. It says so and
      # stops green rather than failing every PR in the meantime.
      - name: The Cloudflare secrets exist
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set, skipping"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # The same fast checks the PR passed, run once more on the merge commit itself, so a
      # merge that combined two green PRs into one broken tree stops here.
      - name: Install HTML Tidy
        run: sudo apt-get update -q && sudo apt-get install -y -q tidy

      - name: The checks pass on the merge commit
        run: python3 tools/check --no-links

      - name: Deploy
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy --var "COMMIT_SHA:${{ github.sha }}" --var "BRANCH:main"
