# Cloudflare Workers configuration. The site is static assets served by a Worker, with the
# Worker running first only under /api/*.
#
# Local preview with the Workers runtime:   wrangler dev
# Validate without uploading:               wrangler deploy --dry-run --outdir /tmp/lwoj-dry
#
# Deploys run on Cloudflare's side through Workers Builds, connected to this repo in the
# dashboard. A push to main deploys production, a push to any other branch creates or
# updates a Preview at a stable URL, and the Cloudflare GitHub app posts that URL on the
# pull request. No Cloudflare credential lives in GitHub, which is the point: a workflow
# that holds a deploy token can be rewritten by any branch that runs it (Codex, PR 42).
#
# Dashboard build settings, Settings > Build on the Worker:
#   Build command     (empty, there is no build step)
#   Deploy command    npx wrangler deploy --var COMMIT_SHA:$WORKERS_CI_COMMIT_SHA --var BRANCH:$WORKERS_CI_BRANCH
#   Preview command   npx wrangler preview --var COMMIT_SHA:$WORKERS_CI_COMMIT_SHA --var BRANCH:$WORKERS_CI_BRANCH
#
# The custom domain is added in the dashboard when O.J. cuts DNS over from GitHub Pages;
# until then the Worker answers on workers.dev only, so nothing here can change where
# learnwithoj.com points.

name = "learnwithoj-com"
main = "functions/worker.js"
compatibility_date = "2026-11-12"

# workers.dev hostname on, which is also what makes Preview URLs resolve.
workers_dev = true

[assets]
# The repo root is the site. .assetsignore lists what stays out of the upload.
directory = "."
binding = "ASSETS"
# Everything is served from assets first except these paths, which the Worker owns.
run_worker_first = ["/api/*"]
# /showcase serves showcase.html, and a trailing slash redirects to the clean path.
html_handling = "auto-trailing-slash"
# Serve 404.html with a 404 status once the page exists. Until then a miss is a plain 404.
not_found_handling = "404-page"

[observability]
enabled = true

# Lets /api/health report which version is answering, with no deploy-time wiring.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Previews do not inherit API bindings from the top level, so each one a Preview needs is
# repeated here. Give a storage binding its own preview resource under this table (for
# example a separate D1 database) the day production gets one.
[previews.version_metadata]
binding = "CF_VERSION_METADATA"
